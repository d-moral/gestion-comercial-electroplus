services:
  app:
    build: .
    container_name: electroplus_app
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./backups:/app/backups
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: electroplus_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

volumes:
  db_data: